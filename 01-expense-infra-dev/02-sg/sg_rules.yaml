- name: SG Rules
  sg:
  - expense-dev-db
  - expense-dev-frontend
  - expense-dev-backend
  - expense-dev-bastion
  - expense-dev-app-alp #backend
  - expense-dev-vpn
  vpn:
  - name: public_vpn
    desc: vpn accepting connections from public
    source: public
    port: 943,443, 22, 1194
  db:
  - name: backend_db
    desc: db accepting conncetions from db_backend
    source: db_backend
    port: 3306
  - name: bastion_db
    desc: db accepting connections from db_bastion
    source: bastion
    port: 3306
  - name: vpn_db
    desc: db accepting connections from vpn
    source: vpn
    port: 3306  
  app_alp:
  - name: vpn_app_alp
    desc: app_alp accepting conncetions from vpn
    source: vpn
    port: 80

  backend:
  - name: app_alp_backend
    desc: backend accepting connections from app_alp
    source: app-alp
    port: 8080
  - name: bastion_backend
    desc: backend accepting conncetions from frontend
    source: bastion
    port: 22
  - name: vpn_backend_ssh
    desc: backend accepting conncetions from vpn
    source: vpn
    port: 22
  - name: vpn_backend_http
    desc: backend accepting conncetions from vpn
    source: vpn
    port: 8080   
  frontend:
  - name: public_frontend
    desc: frontend accepting conncetions from public 
    source: public
    port: 80
  - name: bastion_frontend
    desc: frontend accepting conncetions from bastion
    source: bastion
    port: 22     
  bastion:
  - name: public_bastion
    desc: bastion accepting conncetions from public
    source: public # ideally your home ip address
    port: 22


